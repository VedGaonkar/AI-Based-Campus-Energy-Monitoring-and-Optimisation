name: campus-energy
x-app: &app
  image: campus-energy:local
  build:
    context: ..
    dockerfile: deployment/Dockerfile
  env_file: ${SERVER_ENV_FILE:-.env}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 5000
    PUBLIC_APP_URL: https://${APP_HOST:?Set APP_HOST}
    FRONTEND_ORIGIN: https://${APP_HOST:?Set APP_HOST}
    MONGODB_URI: mongodb://${MONGO_USERNAME:?Set MONGO_USERNAME}:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongo:27017/campus_energy?authSource=admin
    OCR_PYTHON: /opt/vision/bin/python
    DEMO_VISION_PYTHON: /opt/vision/bin/python
    ALLOW_PHYSICAL_CONTROL: "false"
    ALLOW_NATIVE_DEVICE_CONTROL: "false"
    ENABLE_DEMO_SETUP: "false"
    ALLOW_PRODUCTION_DEMO_SEED: "false"
    DEMO_PHONE_ORIGINS: ""
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  depends_on:
    mongo:
      condition: service_healthy
services:
  api:
    <<: *app
    volumes:
      - assistant_state:/app/.local/assistant
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: ["node", "backend/src/workers/run.js"]
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok?0:1)' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  mongo_data:
  assistant_state:
  caddy_data:
  caddy_config:
